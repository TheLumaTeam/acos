openapi: 3.1.0
info:
  title: ACOS Computer API
  version: 1.0.0
  description: Agent-agnostic API for managing virtual machines and OCI containers.
servers:
  - url: http://127.0.0.1:8787/v1
    description: Local development default; remote deployments must use TLS.
security:
  - bearerAuth: []
tags:
  - name: Computers
  - name: Operations
paths:
  /computers:
    get:
      tags: [Computers]
      operationId: listComputers
      responses:
        '200':
          description: Computers visible to the authenticated principal.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Computer' }
    post:
      tags: [Computers]
      operationId: createComputer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateComputerRequest' }
      responses:
        '201':
          description: Computer accepted for creation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Computer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /computers/{computer_id}:
    parameters:
      - $ref: '#/components/parameters/ComputerId'
    get:
      tags: [Computers]
      operationId: getComputer
      responses:
        '200':
          description: Current observed computer state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Computer' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Computers]
      operationId: deleteComputer
      responses:
        '202': { description: Deletion accepted. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /computers/{computer_id}/start:
    parameters:
      - $ref: '#/components/parameters/ComputerId'
    post:
      tags: [Operations]
      operationId: startComputer
      responses:
        '202':
          description: Start request accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Computer' }
        '409': { $ref: '#/components/responses/Conflict' }
  /computers/{computer_id}/stop:
    parameters:
      - $ref: '#/components/parameters/ComputerId'
    post:
      tags: [Operations]
      operationId: stopComputer
      responses:
        '202':
          description: Stop request accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Computer' }
        '409': { $ref: '#/components/responses/Conflict' }
  /computers/{computer_id}/pause:
    parameters:
      - $ref: '#/components/parameters/ComputerId'
    post:
      tags: [Operations]
      operationId: pauseComputer
      responses:
        '202': { description: Pause request accepted if supported by the backend. }
        '501': { $ref: '#/components/responses/Unsupported' }
  /computers/{computer_id}/resume:
    parameters:
      - $ref: '#/components/parameters/ComputerId'
    post:
      tags: [Operations]
      operationId: resumeComputer
      responses:
        '202': { description: Resume request accepted if supported by the backend. }
        '501': { $ref: '#/components/responses/Unsupported' }
  /computers/{computer_id}/commands:
    parameters:
      - $ref: '#/components/parameters/ComputerId'
    post:
      tags: [Operations]
      operationId: executeCommand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandRequest' }
      responses:
        '200':
          description: Command completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/Unsupported' }
  /computers/{computer_id}/agent:
    parameters:
      - $ref: '#/components/parameters/ComputerId'
    get:
      tags: [Operations]
      operationId: getGuestInfo
      responses:
        '200':
          description: Guest OS, hostname, filesystem and QEMU Guest Agent information.
          content:
            application/json:
              schema: { type: object }
        '501': { $ref: '#/components/responses/Unsupported' }
  /computers/{computer_id}/files/{path}:
    parameters:
      - $ref: '#/components/parameters/ComputerId'
      - name: path
        in: path
        required: true
        description: Workspace-relative path (for example src/main.py); access is restricted to /workspace.
        schema: { type: string }
    get:
      tags: [Operations]
      operationId: readFile
      responses:
        '200': { description: File bytes and metadata. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/Unsupported' }
    put:
      tags: [Operations]
      operationId: writeFile
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204': { description: File written. }
        '403': { $ref: '#/components/responses/Forbidden' }
  /computers/{computer_id}/events:
    parameters:
      - $ref: '#/components/parameters/ComputerId'
    get:
      tags: [Operations]
      operationId: streamComputerEvents
      description: Server-Sent Events stream of structured computer events.
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
  /capabilities:
    get:
      tags: [Operations]
      operationId: listCapabilities
      security: []
      responses:
        '200':
          description: Host and backend capabilities available to this API deployment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  capabilities:
                    type: array
                    items: { type: string }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque token
  parameters:
    ComputerId:
      name: computer_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
  schemas:
    Computer:
      type: object
      required: [id, name, kind, state, resources, backend]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, enum: [vm, container] }
        state:
          type: string
          enum: [creating, stopped, starting, running, stopping, paused, failed, unknown]
        resources:
          type: object
          required: [vcpus, memory_mib]
          properties:
            vcpus: { type: integer, minimum: 1 }
            memory_mib: { type: integer, minimum: 64 }
        backend: { type: string }
    CreateComputerRequest:
      type: object
        required: [name, kind, image, resources]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, enum: [vm, container] }
        image: { type: string, description: VM image or OCI image reference. }
        resources:
          type: object
          required: [vcpus, memory_mib]
          properties:
            vcpus: { type: integer, minimum: 1 }
            memory_mib: { type: integer, minimum: 64 }
    CommandRequest:
      type: object
      required: [argv]
      properties:
        argv:
          type: array
          minItems: 1
          items: { type: string }
          description: Argument vector; shell interpretation is never implicit.
        working_directory: { type: string }
        environment:
          type: object
          additionalProperties: { type: string }
        timeout_ms: { type: integer, minimum: 1, maximum: 3600000, default: 30000 }
        output_limit_bytes: { type: integer, minimum: 1024, maximum: 10485760, default: 1048576 }
    CommandResult:
      type: object
      required: [exit_code, stdout, stderr, duration_ms]
      properties:
        exit_code: { type: integer }
        stdout: { type: string, contentEncoding: base64 }
        stderr: { type: string, contentEncoding: base64 }
        duration_ms: { type: integer, minimum: 0 }
        truncated: { type: boolean, default: false }
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        request_id: { type: string }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Principal lacks the required capability.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Computer not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Operation conflicts with the observed computer state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unsupported:
      description: Backend does not support this operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
